<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Orbit — consent-first personal productivity."><title>Orbit</title><style>
:root{--ink:#121313;--muted:#687166;--line:#d8ddd1;--paper:#f6f8f1;--card:#fff;--accent:#254f36;--danger:#ae3325;font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--paper)}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:auto;padding:24px 18px 64px}.top,.row,.entry{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between;margin-bottom:25px}.brand{font-weight:800;font-size:1.4rem;letter-spacing:-.04em}.brand span{display:inline-grid;place-items:center;background:var(--accent);color:#fff;border-radius:50%;width:30px;height:30px;margin-right:7px}.notice,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.notice{background:#fff8df;border-color:#dbc475;color:#584718;padding:11px 14px}.layout{display:grid;grid-template-columns:185px minmax(0,1fr);gap:24px}.nav{display:grid;gap:5px;align-content:start;position:sticky;top:16px}.nav button{text-align:left}.nav button.on,button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button,input,textarea,select{font:inherit;border:1px solid var(--line);background:#fff;color:inherit;border-radius:10px;padding:9px 11px}button{cursor:pointer;font-weight:650}input,textarea,select{width:100%}textarea{min-height:110px;resize:vertical}.card h2{letter-spacing:-.025em;margin:0 0 10px;font-size:1.25rem}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{padding:16px;background:#e5efdf;border-radius:13px}.metric b{display:block;font-size:1.7rem}.muted,small{color:var(--muted)}.entry{padding:13px 0;border-top:1px solid var(--line);align-items:flex-start}.entry:first-child{border-top:0}.entry p{margin:3px 0}.grow{flex:1}.status{font-size:.78rem;padding:2px 8px;border-radius:999px;background:#e8ece5;white-space:nowrap}.status.done{background:#ddefd3}.status.blocked{background:#fde0d9;color:#8c281c}.error{color:var(--danger)}.loader{color:var(--muted);padding:30px;text-align:center}@media(max-width:720px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.layout{display:block}.nav{position:static;grid-template-columns:repeat(3,1fr);margin-bottom:16px}.nav button{text-align:center}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span>O</span>Orbit</div><div class="row"><select id="workspace" aria-label="Workspace"></select><button id="newWorkspace">New workspace</button></div></header><p class="notice">No telephone provider is active. Call requests are safely rejected until consent, provider and legal release checks are complete.</p><div class="layout"><nav class="nav" aria-label="Primary"><button class="on" data-tab="home">Home</button><button data-tab="tasks">Tasks</button><button data-tab="projects">Projects</button><button data-tab="notes">Notes</button><button data-tab="reports">Reports</button><button data-tab="audit">Audit</button></nav><main id="root" aria-live="polite"><div class="loader">Loading workspace…</div></main></div></div><script>
(()=>{const root=document.querySelector('#root'),ws=document.querySelector('#workspace'),S={tab:'home',workspace:localStorage.getItem('orbit.workspace')||'',devUser:localStorage.getItem('orbit.devUser')||'demo-user',projects:[],tasks:[],notes:[]},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),date=v=>v?new Date(v+'T12:00:00').toLocaleDateString():'';async function api(path,o={}){const h={'Content-Type':'application/json','X-Orbit-Dev-User':S.devUser,...(S.workspace?{'X-Orbit-Workspace':S.workspace}:{}),...(o.headers||{})},r=await fetch('/api/'+path,{...o,headers:h});if(!r.ok){const e=await r.json().catch(()=>({detail:r.statusText}));throw Error(e.detail||'Request failed')}return r.status===204?null:r.json()}function fail(e){root.innerHTML=`<section class="card"><h2>Couldn’t load Orbit</h2><p class="error">${esc(e.message)}</p><p class="muted">For local development, start the API with the development identity enabled. Production requires a configured OIDC provider.</p></section>`}async function load(){try{const all=await api('workspaces');if(!all.length){const name=prompt('Name your first workspace','My Orbit');if(!name)return;const made=await api('workspaces',{method:'POST',body:JSON.stringify({name})});S.workspace=made.id}else if(!all.some(w=>w.id===S.workspace))S.workspace=all[0].id;localStorage.setItem('orbit.workspace',S.workspace);ws.innerHTML=all.map(w=>`<option value="${w.id}" ${w.id===S.workspace?'selected':''}>${esc(w.name)} · ${esc(w.role)}</option>`).join('');await data();render()}catch(e){fail(e)}}async function data(){[S.projects,S.tasks,S.notes]=await Promise.all([api('projects'),api('tasks'),api('notes')])}const opts=(v='')=>`<option value="">No project</option>${S.projects.map(p=>`<option value="${p.id}" ${p.id===v?'selected':''}>${esc(p.title)}</option>`).join('')}`,pn=id=>esc((S.projects.find(p=>p.id===id)||{}).title||'No project');function task(t){return `<div class="entry"><span class="status ${t.status==='Done'?'done':t.status==='Blocked'?'blocked':''}">${esc(t.status)}</span><div class="grow"><b>${esc(t.title)}</b><p class="muted">${pn(t.project_id)}${t.due_date?' · due '+date(t.due_date):''}${t.estimate_hours?' · '+t.estimate_hours+'h':''}</p></div><select aria-label="Status for ${esc(t.title)}" data-status="${t.id}">${['Inbox','Todo','In Progress','Blocked','Done','Cancelled'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></div>`}function metrics(){const open=S.tasks.filter(t=>!['Done','Cancelled'].includes(t.status)),over=open.filter(t=>t.due_date&&t.due_date<=new Date().toISOString().slice(0,10)),block=open.filter(t=>t.status==='Blocked');return `<section class="grid">${[['Open',open.length],['Overdue',over.length],['Blocked',block.length],['Projects',S.projects.length]].map(([l,n])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')}</section>`}function home(){const top=S.tasks.filter(t=>!['Done','Cancelled'].includes(t.status)).sort((a,b)=>(a.due_date||'9999').localeCompare(b.due_date||'9999')||b.priority-a.priority).slice(0,3);return `${metrics()}<section class="card"><h2>Next best actions</h2>${top.length?top.map(task).join(''):'<p class="muted">No open tasks. Capture a task to get started.</p>'}</section><section class="card"><h2>Safe call status</h2><p>Outbound calling is disabled. A production path must pass consent, quiet-hour, quota, provider, security and legal release gates first.</p><button class="primary" id="dryRun">Run safe call policy check</button></section>`}function tasks(){return `<section class="card"><h2>Add task</h2><form id="taskForm" class="row"><input class="grow" name="title" required maxlength="240" placeholder="What needs doing?"><select name="priority"><option value="3">High priority</option><option value="2" selected>Medium priority</option><option value="1">Low priority</option></select><input name="due_date" type="date"><input name="estimate_hours" type="number" min="0" step="0.5" placeholder="Hours"><select name="project_id">${opts()}</select><button class="primary">Add task</button></form></section><section class="card"><h2>Tasks</h2>${S.tasks.length?S.tasks.map(task).join(''):'<p class="muted">No tasks yet.</p>'}</section>`}function projects(){return `<section class="card"><h2>New project</h2><form id="projectForm" class="row"><input class="grow" name="title" required maxlength="200" placeholder="Project name"><input class="grow" name="goal" maxlength="5000" placeholder="What does success mean?"><input name="due_date" type="date"><button class="primary">Create project</button></form></section><section class="card"><h2>Projects</h2>${S.projects.length?S.projects.map(p=>`<div class="entry"><div class="grow"><b>${esc(p.title)}</b><p>${esc(p.goal)||'<span class="muted">No goal defined.</span>'}</p><small>${p.due_date?'Target '+date(p.due_date):'No target date'}</small></div></div>`).join(''):'<p class="muted">No projects yet.</p>'}</section>`}function notes(){return `<section class="card"><h2>New note</h2><form id="noteForm"><div class="row"><input class="grow" name="title" required maxlength="240" placeholder="Title"><select name="project_id">${opts()}</select></div><textarea name="body" maxlength="50000" placeholder="Write a useful note…"></textarea><button class="primary">Save note</button></form></section><section class="card"><h2>Notes</h2>${S.notes.length?S.notes.map(n=>`<div class="entry"><div><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small>${pn(n.project_id)} · ${new Date(n.created_at).toLocaleString()}</small></div></div>`).join(''):'<p class="muted">No notes yet.</p>'}</section>`}async function reports(){root.innerHTML='<div class="loader">Calculating deterministic report…</div>';try{const r=await api('report/weekly');root.innerHTML=`<section class="card"><h2>Weekly report</h2><div class="grid">${[['Completed',r.completed],['Overdue',r.overdue],['Blocked',r.blocked]].map(([l,n])=>`<div class="metric"><b>${n}</b><small>${l}</small></div>`).join('')}</div><p class="muted">${esc(r.definition)}</p></section>`}catch(e){fail(e)}}async function audit(){root.innerHTML='<div class="loader">Loading audit trail…</div>';try{const events=await api('audit');root.innerHTML=`<section class="card"><h2>Audit trail</h2><p class="muted">Every write is attributed and workspace-scoped.</p>${events.length?events.map(e=>`<div class="entry"><div><b>${esc(e.action)}</b><p class="muted">${new Date(e.created_at).toLocaleString()} · ${esc(e.source)} · ${esc(e.correlation_id)}</p></div></div>`).join(''):'<p class="muted">No events yet.</p>'}</section>`}catch(e){fail(e)}}function render(){if(S.tab==='reports')return reports();if(S.tab==='audit')return audit();root.innerHTML={home,tasks,projects,notes}[S.tab]();bind()}function bind(){document.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{try{await api('tasks/'+el.dataset.status,{method:'PATCH',body:JSON.stringify({status:el.value})});await data();render()}catch(e){alert(e.message);render()}});for(const [id,path]of [['#taskForm','tasks'],['#projectForm','projects'],['#noteForm','notes']]){const form=document.querySelector(id);if(form)form.onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(form));for(const k in o)if(o[k]==='')o[k]=null;if(o.estimate_hours!==null)o.estimate_hours=Number(o.estimate_hours);try{await api(path,{method:'POST',body:JSON.stringify(o)});await data();render()}catch(x){alert(x.message)}}}const dry=document.querySelector('#dryRun');if(dry)dry.onclick=async()=>{try{const r=await api('calls',{method:'POST',body:JSON.stringify({mode:'on_demand'})});alert(r.reasons.join('. '))}catch(e){alert(e.message)}}}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));render()});ws.onchange=async()=>{S.workspace=ws.value;localStorage.setItem('orbit.workspace',S.workspace);await data();render()};document.querySelector('#newWorkspace').onclick=async()=>{const name=prompt('Workspace name');if(!name)return;try{const made=await api('workspaces',{method:'POST',body:JSON.stringify({name})});S.workspace=made.id;await load()}catch(e){alert(e.message)}};load()})()
</script></body></html>
